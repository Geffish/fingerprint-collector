[package]
name = "fingerprint-collector"
version = "1.0.0"
description = "Network Fingerprint Collector - gathers system and network details and logs them to CSV"
authors = ["Peter Geffert"]
license = ""
repository = "https://github.com/Geffish/fingerprint-collector"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fingerprint_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
mac_address = "1"
chrono = "0.4"
csv = "1"
netdev = "0.47"
socket2 = { version = "0.6", features = ["all"] }
dns-lookup = "4"
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
